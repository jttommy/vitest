name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# https://github.com/vitejs/vite/blob/main/.github/workflows/ci.yml
env:
  # 7 GiB by default on GitHub, setting to 6 GiB
  # https://docs.github.com/en/actions/using-github-hosted-runners/about-github-hosted-runners#supported-runners-and-hardware-resources
  NODE_OPTIONS: --max-old-space-size=6144

# Remove default permissions of GITHUB_TOKEN for security
# https://docs.github.com/en/actions/using-jobs/assigning-permissions-to-jobs
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

      - name: Format check
        run: pnpm format

      - name: Lint
        run: pnpm lint

      - name: Knip
        run: pnpm knip

      - name: Check engine ranges, peer dependency ranges and installed versions
        run: pnpm test:engines

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: pnpm install

      - name: Build module
        run: pnpm build && pnpm install

      - name: Run unit tests
        run: pnpm test:unit

      - name: Check public types
        run: pnpm test:types

      - name: Test examples
        run: pnpm test:e2e

  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        vitest: [2, 3, 4, 5]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Pack the adapter for an isolated consumer
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/stencil-vitest-compat/test/types"
          cp tsconfig.json tsconfig.types.json test/compat/*.ts "$RUNNER_TEMP/stencil-vitest-compat/"
          cp test/types/matchers.ts "$RUNNER_TEMP/stencil-vitest-compat/test/types/"
          if [ "${{ matrix.vitest }}" = "5" ]; then
            cp test/types/browser.ts "$RUNNER_TEMP/stencil-vitest-compat/test/types/"
          fi
          pnpm pack --pack-destination "$RUNNER_TEMP/stencil-vitest-compat"

      - name: Install the consumer's Vitest version
        working-directory: ${{ runner.temp }}/stencil-vitest-compat
        run: npm install --no-audit --no-fund ./*.tgz vitest@${{ matrix.vitest }} @stencil/core@4 typescript@5 @types/node@24

      - name: Install browser matcher declarations
        if: matrix.vitest == 5
        working-directory: ${{ runner.temp }}/stencil-vitest-compat
        run: npm install --no-audit --no-fund @vitest/browser@5

      - name: Check the built environment and public types
        working-directory: ${{ runner.temp }}/stencil-vitest-compat
        run: npx tsc -p tsconfig.types.json && npx vitest run
